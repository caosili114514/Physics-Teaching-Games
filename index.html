<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050b1c">
<title>电路侦探社——中考电学闯关</title>
<style>
:root{
  --bg:#050b1c; --bg2:#0a1530; --card:#0d1b3a; --card2:#0a1430;
  --line:rgba(56,189,248,.28); --line2:rgba(56,189,248,.55);
  --cy:#22d3ee; --cy2:#0891b2; --blue:#38bdf8; --pur:#a855f7;
  --pink:#f472b6; --grn:#22c55e; --red:#ef4444; --yel:#facc15;
  --tx:#dbeafe; --tx2:#93c5fd; --tx3:#64748b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh; color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(34,211,238,.14), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(168,85,247,.14), transparent 42%),
    linear-gradient(rgba(56,189,248,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.045) 1px, transparent 1px),
    radial-gradient(circle at 50% 50%, #0a1530, #050b1c 75%);
  background-size:auto,auto,42px 42px,42px 42px,auto;
  background-attachment:fixed;
  padding-bottom:40px;
  overflow-x:hidden;
}
#app{max-width:880px;margin:0 auto;padding:0 12px;}
h1,h2,h3,h4{margin:0 0 10px;}
button{font-family:inherit;}
a{color:var(--cy);}

/* ---------- 通用组件 ---------- */
.card{
  background:linear-gradient(160deg, rgba(15,32,66,.94), rgba(8,17,40,.96));
  border:1px solid var(--line); border-radius:var(--r);
  box-shadow:0 8px 30px rgba(2,8,23,.6), inset 0 1px 0 rgba(255,255,255,.05);
  padding:16px; margin-bottom:14px;
}
.card-title{font-size:16px;font-weight:800;color:#e0f2fe;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);}
.muted{color:var(--tx2);font-size:13px;line-height:1.7;}
.tiny{font-size:12px;color:var(--tx3);}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  border:1px solid var(--line2); color:#a5f3fc; background:linear-gradient(180deg,rgba(34,211,238,.16),rgba(34,211,238,.04));
  transition:.16s; user-select:none; line-height:1.2;
}
.btn:hover:not(:disabled){box-shadow:0 0 18px rgba(34,211,238,.45);transform:translateY(-1px);}
.btn:active:not(:disabled){transform:translateY(0) scale(.98);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.primary{background:linear-gradient(180deg,#22d3ee,#0369a1);color:#01131f;border-color:#67e8f9;text-shadow:0 1px 0 rgba(255,255,255,.25);}
.btn.primary:hover:not(:disabled){box-shadow:0 0 24px rgba(34,211,238,.7);}
.btn.purple{background:linear-gradient(180deg,rgba(168,85,247,.28),rgba(168,85,247,.08));color:#e9d5ff;border-color:rgba(168,85,247,.6);}
.btn.pink{background:linear-gradient(180deg,rgba(244,114,182,.25),rgba(244,114,182,.07));color:#fbcfe8;border-color:rgba(244,114,182,.6);}
.btn.ghost{background:rgba(15,32,66,.6);color:var(--tx2);border-color:var(--line);}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
.btn.full{width:100%;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;}

.input{
  width:100%;padding:11px 13px;border-radius:11px;font-size:15px;
  background:rgba(3,10,26,.85);border:1px solid var(--line);color:#e0f2fe;outline:none;
  transition:.15s;
}
.input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.15);}
.input::placeholder{color:#475569;}
select.input{cursor:pointer;}
label.lb{display:block;font-size:13px;color:var(--tx2);margin:0 0 6px;font-weight:600;}

.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.7;border:1px solid transparent;}
.tag.easy{background:rgba(34,197,94,.16);color:#86efac;border-color:rgba(34,197,94,.4);}
.tag.mid{background:rgba(250,204,21,.16);color:#fde047;border-color:rgba(250,204,21,.4);}
.tag.hard{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.45);}
.tag.k{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.35);}
.tag.type{background:rgba(168,85,247,.16);color:#d8b4fe;border-color:rgba(168,85,247,.4);}

/* ---------- 顶部栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 4px 10px;position:sticky;top:0;z-index:50;
  background:linear-gradient(180deg,rgba(5,11,28,.97) 60%,rgba(5,11,28,0));
  backdrop-filter:blur(6px);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;letter-spacing:.5px;}
.brand .logo{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,#0891b2,#7c3aed);box-shadow:0 0 16px rgba(34,211,238,.6);
}
.brand small{display:block;font-size:10px;font-weight:500;color:var(--tx2);letter-spacing:2px;}
.hud{display:flex;gap:8px;align-items:center;font-size:12px;}
.hud .chip{
  background:rgba(10,21,48,.9);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;white-space:nowrap;font-weight:700;color:#a5f3fc;
}
.hud .chip b{color:#fff;}

/* ---------- 首页 ---------- */
.hero{text-align:center;padding:22px 14px 18px;}
.hero h1{
  font-size:27px;line-height:1.3;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,#67e8f9,#a78bfa,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 34px rgba(103,232,249,.25);
}
.hero sub{display:block;margin-top:8px;font-size:13px;color:var(--tx2);letter-spacing:.5px;font-weight:500;}
.avatar-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.avatar-pick{
  width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer;
  background:rgba(10,21,48,.9);border:1px solid var(--line);transition:.15s;
}
.avatar-pick:hover{border-color:var(--line2);transform:translateY(-2px);}
.avatar-pick.on{border-color:var(--cy);box-shadow:0 0 14px rgba(34,211,238,.55);background:rgba(34,211,238,.15);}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:420px){.mode-grid{grid-template-columns:1fr;}}
.mode-btn{
  text-align:left;padding:14px;border-radius:14px;cursor:pointer;transition:.16s;
  background:linear-gradient(150deg,rgba(17,36,72,.95),rgba(8,17,40,.95));
  border:1px solid var(--line);color:var(--tx);
}
.mode-btn:hover{border-color:var(--cy);box-shadow:0 0 20px rgba(34,211,238,.28);transform:translateY(-2px);}
.mode-btn .mt{font-weight:800;font-size:15px;margin-bottom:4px;color:#e0f2fe;}
.mode-btn .md{font-size:12px;color:var(--tx2);line-height:1.6;}

/* ---------- 关卡列表 ---------- */
.level-item{
  display:flex;align-items:center;gap:12px;padding:13px;border-radius:14px;cursor:pointer;
  background:linear-gradient(140deg,rgba(17,36,72,.9),rgba(8,17,40,.9));
  border:1px solid var(--line);transition:.16s;margin-bottom:10px;
}
.level-item:hover{border-color:var(--cy);box-shadow:0 0 18px rgba(34,211,238,.25);transform:translateX(3px);}
.level-item .num{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font-weight:900;font-size:17px;color:#03121f;
  background:linear-gradient(135deg,#22d3ee,#0ea5e9);box-shadow:0 0 14px rgba(34,211,238,.5);
}
.level-item .li-t{font-weight:800;font-size:15px;color:#e0f2fe;margin-bottom:3px;}
.level-item .li-d{font-size:12px;color:var(--tx2);}
.level-item .li-r{margin-left:auto;text-align:right;font-size:11px;color:var(--tx3);flex:0 0 auto;}
.level-item .li-r b{display:block;font-size:16px;color:#fde047;}

/* ---------- 答题 ---------- */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.qstem{font-size:16px;line-height:1.78;color:#f0f9ff;font-weight:600;word-break:break-word;}
.figure-box{margin:12px 0;padding:8px;border-radius:14px;background:rgba(3,10,26,.9);border:1px solid var(--line);text-align:center;}
.figure-box svg{max-width:100%;height:auto;display:block;margin:0 auto;}

.option{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:rgba(10,21,48,.75);cursor:pointer;
  transition:.14s;margin-bottom:9px;font-size:14.5px;line-height:1.65;
}
.option:hover{border-color:var(--line2);background:rgba(15,35,72,.9);}
.option .k{
  flex:0 0 24px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:rgba(56,189,248,.16);color:#7dd3fc;border:1px solid var(--line);
}
.option.sel{border-color:var(--cy);background:rgba(34,211,238,.15);box-shadow:0 0 16px rgba(34,211,238,.32);}
.option.sel .k{background:var(--cy);color:#03121f;border-color:var(--cy);}
.option.ok{border-color:var(--grn);background:rgba(34,197,94,.14);box-shadow:0 0 16px rgba(34,197,94,.3);}
.option.ok .k{background:var(--grn);color:#04170a;border-color:var(--grn);}
.option.bad{border-color:var(--red);background:rgba(239,68,68,.13);}
.option.bad .k{background:var(--red);color:#fff;border-color:var(--red);}
.option.dis{cursor:default;}

.fill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;}
.fill-row .input{flex:1 1 200px;}
.unit-inline{padding:11px 14px;border-radius:11px;background:rgba(3,10,26,.9);border:1px solid var(--line);color:#7dd3fc;font-weight:700;white-space:nowrap;}

.progress{height:7px;border-radius:999px;background:rgba(3,10,26,.9);overflow:hidden;border:1px solid var(--line);margin-bottom:12px;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a855f7);transition:width .3s;box-shadow:0 0 12px rgba(34,211,238,.7);}

.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--tx2);}

/* ---------- 解析 ---------- */
.result-box{margin-top:14px;border-radius:14px;padding:14px;border:1px solid;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.result-box.ok{border-color:rgba(34,197,94,.5);background:linear-gradient(160deg,rgba(34,197,94,.13),rgba(8,17,40,.9));}
.result-box.bad{border-color:rgba(239,68,68,.5);background:linear-gradient(160deg,rgba(239,68,68,.12),rgba(8,17,40,.9));}
.rb-head{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;margin-bottom:10px;}
.rb-head .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;}
.result-box.ok .ico{background:rgba(34,197,94,.22);color:#86efac;}
.result-box.bad .ico{background:rgba(239,68,68,.22);color:#fca5a5;}
.ans-line{padding:9px 12px;border-radius:10px;background:rgba(3,10,26,.75);border:1px solid var(--line);margin-bottom:10px;font-size:14px;}
.ans-line b{color:#fde047;}
.sec{margin-bottom:10px;}
.sec .sh{font-size:12px;font-weight:800;color:#7dd3fc;letter-spacing:1px;margin-bottom:4px;display:flex;align-items:center;gap:5px;}
.sec .sb{font-size:13.5px;line-height:1.82;color:#cbd5e1;white-space:pre-wrap;word-break:break-word;}
.sec.formula .sb{
  font-family:"Cambria Math",Georgia,serif;color:#67e8f9;font-size:14.5px;
  background:rgba(3,10,26,.8);padding:9px 12px;border-radius:10px;border-left:3px solid var(--cy);
}
.sec.pit .sb{color:#fdba74;}
.gain-tip{font-size:12px;color:#86efac;font-weight:700;margin-top:4px;}

/* ---------- 徽章 ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
.badge{text-align:center;padding:12px 6px;border-radius:14px;background:rgba(10,21,48,.8);border:1px solid var(--line);position:relative;transition:.16s;}
.badge.on{border-color:rgba(250,204,21,.6);background:linear-gradient(160deg,rgba(250,204,21,.13),rgba(10,21,48,.9));box-shadow:0 0 18px rgba(250,204,21,.22);}
.badge.off{opacity:.42;filter:grayscale(1);}
.badge .bi{font-size:27px;line-height:1.2;}
.badge .bn{font-size:11.5px;font-weight:800;margin-top:5px;color:#e0f2fe;line-height:1.4;}
.badge .bd{font-size:10px;color:var(--tx3);margin-top:3px;line-height:1.4;}

/* ---------- 排行榜 ---------- */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.tab{padding:7px 14px;border-radius:999px;background:rgba(10,21,48,.85);border:1px solid var(--line);color:var(--tx2);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;}
.tab:hover{border-color:var(--line2);color:#a5f3fc;}
.tab.on{background:linear-gradient(180deg,rgba(34,211,238,.24),rgba(34,211,238,.08));border-color:var(--cy);color:#a5f3fc;box-shadow:0 0 14px rgba(34,211,238,.3);}
.rank-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid transparent;margin-bottom:7px;background:rgba(10,21,48,.6);}
.rank-row.me{border-color:var(--cy);background:rgba(34,211,238,.1);box-shadow:0 0 16px rgba(34,211,238,.18);}
.rank-no{flex:0 0 30px;text-align:center;font-weight:900;font-size:15px;color:var(--tx2);}
.rank-no.g1{color:#fde047;} .rank-no.g2{color:#e2e8f0;} .rank-no.g3{color:#fdba74;}
.rank-av{flex:0 0 38px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:rgba(3,10,26,.9);border:1px solid var(--line);}
.rank-info{flex:1;min-width:0;}
.rank-info .rn{font-weight:800;font-size:14px;color:#e0f2fe;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-info .rd{font-size:11px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-sc{text-align:right;flex:0 0 auto;}
.rank-sc b{display:block;font-size:15px;color:#fde047;font-weight:900;}
.rank-sc span{font-size:10px;color:var(--tx3);}

/* ---------- 错题本 ---------- */
.wrong-item{padding:11px 13px;border-radius:12px;background:rgba(10,21,48,.7);border:1px solid var(--line);margin-bottom:9px;}
.wrong-item .wi-t{font-size:13.5px;line-height:1.65;color:#cbd5e1;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.wrong-item .wi-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;}

/* ---------- 弹窗 / Toast ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(2,6,18,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:400;animation:fadeUp .18s;}
.modal{width:100%;max-width:460px;max-height:86vh;overflow:auto;border-radius:18px;padding:18px;background:linear-gradient(160deg,#0f2148,#08112a);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.7);}
.modal h3{font-size:17px;color:#e0f2fe;}
.modal textarea.input{min-height:90px;resize:vertical;line-height:1.6;}

.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:rgba(8,20,44,.97);border:1px solid var(--cy);color:#a5f3fc;
  padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:600;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 0 24px rgba(34,211,238,.45);max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.badge-pop{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);
  z-index:700;text-align:center;padding:26px 34px;border-radius:22px;
  background:linear-gradient(160deg,#1e293b,#0b1120);border:2px solid rgba(250,204,21,.7);
  box-shadow:0 0 60px rgba(250,204,21,.45);opacity:0;transition:.32s cubic-bezier(.34,1.56,.64,1);
}
.badge-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.badge-pop .bp-i{font-size:56px;line-height:1;filter:drop-shadow(0 0 18px rgba(250,204,21,.9));}
.badge-pop .bp-t{font-size:13px;color:#fde047;letter-spacing:3px;margin-top:10px;font-weight:800;}
.badge-pop .bp-n{font-size:20px;font-weight:900;color:#fff;margin-top:4px;}
.badge-pop .bp-d{font-size:12px;color:var(--tx2);margin-top:6px;}

table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th,table.tbl td{padding:8px 9px;border-bottom:1px solid rgba(56,189,248,.16);text-align:left;}
table.tbl th{color:#7dd3fc;font-weight:800;font-size:12px;}
table.tbl tr:hover td{background:rgba(34,211,238,.05);}
.hl{color:#fde047;font-weight:800;}
.code{font-family:Consolas,Monaco,monospace;font-size:12px;background:rgba(3,10,26,.85);padding:2px 6px;border-radius:5px;color:#67e8f9;}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:520px){.split{grid-template-columns:1fr;}}
.fb-item{padding:10px;border-radius:11px;background:rgba(10,21,48,.7);border:1px solid var(--line);margin-bottom:8px;font-size:12.5px;line-height:1.65;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* =========================================================
   电路侦探社——中考电学闯关
   单文件版  localStorage 持久化
   ========================================================= */

/* ---------- 0. 基础工具 ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){
  return String(s===null||s===undefined?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function getWeekKey(d){
  var t = new Date(d.getTime()); t.setHours(0,0,0,0);
  var day = (t.getDay()+6)%7;      // 周一为 0
  t.setDate(t.getDate()-day);
  return dateKey(t);
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

var toastTimer = null;
function toast(msg){
  var el = $('#toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
}

/* ---------- 1. 音效（可开关，全程 try/catch 防报错） ---------- */
var audioCtx = null;
function beep(freq, dur, type, vol){
  if(!state.settings || !state.settings.sound) return;
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    var v = vol===undefined ? 0.13 : vol;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(v, now+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur/1000);
    o.start(now);
    o.stop(now + dur/1000 + 0.03);
  }catch(e){ /* 忽略音频异常，不影响主流程 */ }
}

var LS_KEY = 'CIRCUIT_DETECTIVE_V1';

function defaultState(){
  return {
    version: 1,
    profile: { nickname:'', avatar:'🕵️', className:'初三(1)班', grade:'九年级' },
    totalScore: 0,
    weekBaseline: 0,
    weekKey: getWeekKey(new Date()),
    correct: 0,
    answered: 0,
    maxCombo: 0,
    totalTimeMs: 0,
    badges: {},
    wrongBook: {},
    qLog: {},
    firstCorrect: {},
    typeStats: {},
    knowledgeStats: {},
    levelBest: {},
    lastLogin: '',
    streakDays: 0,
    feedback: [],
    settings: { sound:true },
    bankEdits: {},
    imported: []
  };
}
var state = defaultState();

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    var obj = JSON.parse(raw);
    if(!obj || typeof obj !== 'object') return false;
    var base = defaultState();
    state = Object.assign(base, obj);
    state.profile  = Object.assign(base.profile,  obj.profile  || {});
    state.settings = Object.assign({sound:true},   obj.settings || {});
    if(!Array.isArray(state.feedback)) state.feedback = [];
    if(!Array.isArray(state.imported)) state.imported = [];
    if(!state.badges || typeof state.badges!=='object') state.badges = {};
    if(!state.wrongBook || typeof state.wrongBook!=='object') state.wrongBook = {};
    if(!state.qLog || typeof state.qLog!=='object') state.qLog = {};
    if(!state.firstCorrect || typeof state.firstCorrect!=='object') state.firstCorrect = {};
    if(!state.typeStats || typeof state.typeStats!=='object') state.typeStats = {};
    if(!state.knowledgeStats || typeof state.knowledgeStats!=='object') state.knowledgeStats = {};
    if(!state.levelBest || typeof state.levelBest!=='object') state.levelBest = {};
    if(!state.bankEdits || typeof state.bankEdits!=='object') state.bankEdits = {};
    var wk = getWeekKey(new Date());
    if(state.weekKey !== wk){ state.weekKey = wk; state.weekBaseline = state.totalScore; }
    return true;
  }catch(e){
    console.warn('[存档] 读取失败，已使用新存档', e);
    state = defaultState();
    return false;
  }
}
function saveState(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }catch(e){
    console.warn('[存档] 写入失败', e);
    toast('本地存储写入失败，请检查浏览器隐私设置');
  }
}

/* 每日首次登录 +5 */
function checkDailyLogin(){
  var today = dateKey(new Date());
  if(state.lastLogin === today) return 0;
  var y = new Date(Date.now() - 86400000);
  var yKey = dateKey(y);
  if(state.lastLogin === yKey) state.streakDays = (state.streakDays||0) + 1;
  else state.streakDays = 1;
  state.lastLogin = today;
  state.totalScore += 5;
  return 5;
}

function checkBadges(){

/* ---------- 4. 电路图 / 图像 SVG 生成器 ---------- */
function ammeterSVG(){
  var cx=150, cy=128, R=96, start=210, sweep=240, N=30;
  function pt(deg, r){
    var rad = deg*Math.PI/180;
    return [ cx + r*Math.cos(rad), cy - r*Math.sin(rad) ];
  }
  var ticks='', labels='', i, deg, p1, p2, lp, major;
  for(i=0;i<=N;i++){
    deg = start - (i/N)*sweep;
    major = (i%5===0);
    p1 = pt(deg, R);
    p2 = pt(deg, R - (major?16:8));
    ticks += '<line x1="'+p1[0].toFixed(1)+'" y1="'+p1[1].toFixed(1)+
             '" x2="'+p2[0].toFixed(1)+'" y2="'+p2[1].toFixed(1)+
             '" stroke="'+(major?'#7dd3fc':'#2b7fb8')+'" stroke-width="'+(major?2:1)+
             '" stroke-linecap="round"/>';
  }
  for(i=0;i<=N;i+=5){
    deg = start - (i/N)*sweep;
    lp = pt(deg, R-31);
    labels += '<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+
              '" fill="#bae6fd" font-size="11" text-anchor="middle" font-family="monospace">'+
              (i/N*0.6).toFixed(1)+'</text>';
  }
  var pd = start - (0.24/0.6)*sweep;
  var pp = pt(pd, 76);
  return '<svg viewBox="0 0 300 190" role="img" aria-label="电流表表盘，指针指在0.2A右侧第二小格">'+
    '<defs><radialGradient id="amg" cx="50%" cy="70%"><stop offset="0%" stop-color="#0d2a4d"/><stop offset="100%" stop-color="#050f22"/></radialGradient></defs>'+
    '<rect x="3" y="3" width="294" height="184" rx="16" fill="url(#amg)" stroke="#1d4ed8" stroke-width="1.5"/>'+
    ticks+labels+
    '<line x1="'+cx+'" y1="'+cy+'" x2="'+pp[0].toFixed(1)+'" y2="'+pp[1].toFixed(1)+
      '" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round" style="filter:drop-shadow(0 0 5px #f472b6)"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="6.5" fill="#f472b6"/>'+
    '<text x="150" y="104" fill="#67e8f9" font-size="15" text-anchor="middle" font-weight="bold">A</text>'+
    '<text x="150" y="173" fill="#60a5fa" font-size="12" text-anchor="middle">量程 0～0.6A　分度值 0.02A</text>'+
  '</svg>';
}

function uiGraphSVG(){
  var X0=62, X1=268, Y0=206, Y1=42;
  function gx(I){ return X0 + (I/0.4)*(X1-X0); }
  function gy(U){ return Y0 - (U/8)*(Y0-Y1); }
  var s='';
  var i;
  for(i=0;i<=4;i++){
    var yy = gy(i*2);
    s += '<line x1="'+X0+'" y1="'+yy.toFixed(1)+'" x2="'+X1+'" y2="'+yy.toFixed(1)+'" stroke="rgba(56,189,248,.12)" stroke-width="1"/>';
    s += '<text x="'+(X0-8)+'" y="'+(yy+4).toFixed(1)+'" fill="#60a5fa" font-size="11" text-anchor="end">'+(i*2)+'</text>';
  }
  for(i=0;i<=4;i++){
    var xx = gx(i*0.1);
    s += '<line x1="'+xx.toFixed(1)+'" y1="'+Y0+'" x2="'+xx.toFixed(1)+'" y2="'+Y1+'" stroke="rgba(56,189,248,.12)" stroke-width="1"/>';
    s += '<text x="'+xx.toFixed(1)+'" y="'+(Y0+18)+'" fill="#60a5fa" font-size="11" text-anchor="middle">'+(i*0.1).toFixed(1)+'</text>';
  }
  s += '<line x1="'+X0+'" y1="'+Y0+'" x2="'+(X1+12)+'" y2="'+Y0+'" stroke="#38bdf8" stroke-width="1.8"/>';
  s += '<line x1="'+X0+'" y1="'+Y0+'" x2="'+X0+'" y2="'+(Y1-12)+'" stroke="#38bdf8" stroke-width="1.8"/>';
  s += '<polygon points="'+(X1+12)+','+Y0+' '+(X1+3)+','+(Y0-4)+' '+(X1+3)+','+(Y0+4)+'" fill="#38bdf8"/>';
  s += '<polygon points="'+X0+','+(Y1-12)+' '+(X0-4)+','+(Y1-3)+' '+(X0+4)+','+(Y1-3)+'" fill="#38bdf8"/>';
  s += '<text x="'+(X1+16)+'" y="'+(Y0+5)+'" fill="#7dd3fc" font-size="12">I/A</text>';
  s += '<text x="'+(X0-4)+'" y="'+(Y1-20)+'" fill="#7dd3fc" font-size="12">U/V</text>';
  // 直线
  s += '<line x1="'+gx(0)+'" y1="'+gy(0)+'" x2="'+gx(0.4)+'" y2="'+gy(8)+'" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(34,211,238,.8))"/>';
  // 关键点 (0.3, 6)
  var px = gx(0.3), py = gy(6);
  s += '<line x1="'+X0+'" y1="'+py.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="5,4"/>';
  s += '<line x1="'+px.toFixed(1)+'" y1="'+Y0+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="#f472b6" stroke-width="1.2" stroke-dasharray="5,4"/>';
  s += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="5" fill="#f472b6"/>';
  s += '<text x="'+(px+9).toFixed(1)+'" y="'+(py-9).toFixed(1)+'" fill="#fbcfe8" font-size="12">(0.3A, 6V)</text>';
  return '<svg viewBox="0 0 320 236" role="img" aria-label="某导体U-I关系图像，过原点直线">'+
    '<rect x="2" y="2" width="316" height="232" rx="14" fill="#050f22" stroke="rgba(56,189,248,.25)"/>'+ s +'</svg>';
}

var UNIT_MAP = {
  'A':'A','安':'A','安培':'A','amps':'A','ampere':'A',
  'V':'V','伏':'V','伏特':'V','volt':'V',
  'Ω':'Ω','欧':'Ω','欧姆':'Ω','OHM':'Ω',
  'W':'W','瓦':'W','瓦特':'W','watt':'W',
  'J':'J','焦':'J','焦耳':'J','joule':'J',
  'HZ':'Hz','赫':'Hz','赫兹':'Hz',
  'S':'s','秒':'s','SEC':'s',
  'MIN':'min','分':'min','分钟':'min',
  'H':'h','时':'h','小时':'h',
  'KWH':'kW·h','KW·H':'kW·h','千瓦时':'kW·h','度':'kW·h',
  '%':'%','N':'N','牛':'N','牛顿':'N',
  'KG':'kg','千克':'kg','G':'g','克':'g',
  'M':'m','米':'m','CM':'cm','厘米':'cm','MM':'mm',
  '㎡':'m²','M2':'m²','平方米':'m²',
  'M³':'m³','M3':'m³','立方米':'m³','L':'L','升':'L','ML':'mL','毫升':'mL',
  'C':'C','库':'C','库仑':'C',
  '℃':'℃','摄氏度':'℃'
};
function normalizeUnit(u){
  if(!u) return '';
  var k = String(u).trim().replace(/\s+/g,'').replace(/[·・•．.。]/g,'');
  k = k.replace(/[（(]/g,'').replace(/[）)]/g,'');
  var up = k.toUpperCase();
  if(UNIT_MAP[up]) return UNIT_MAP[up];
  if(UNIT_MAP[k]) return UNIT_MAP[k];
  // 处理 kW·h 之类的组合
  if(up.indexOf('KWH')>=0 || up.indexOf('KW')>=0 && up.indexOf('H')>=0) return 'kW·h';
  return k;
}
function unitsEqual(a, b){
  if(!a && !b) return true;
  if(!a || !b) return false;
  return normalizeUnit(a) === normalizeUnit(b);
}

/* 把用户输入解析成 {value, unit} */
function parseNumericInput(raw){
  if(raw === null || raw === undefined) return null;
  var s = String(raw).trim();
  if(!s) return null;
  // 统一常见符号
  s = s.replace(/\s+/g,'')
       .replace(/[，,]/g,'')
       .replace(/。/g,'.')
       .replace(/[＊*]/g,'×')
       .replace(/[−–—]/g,'-')
       .replace(/[＝]/g,'=')
       .replace(/[（(]/g,'')
       .replace(/[）)]/g,'');
  if(!s) return null;
  var m = s.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)(.*)$/);
  if(!m) return null;
  var num = Number(m[1]);
  if(!isFinite(num)) return null;
  return { value: num, unit: (m[2]||'').replace(/[·・•]/g,'·') };
}

/* 判断数值 + 单位 */
function judgeNumeric(q, raw){
  var parsed = parseNumericInput(raw);
  if(parsed === null){
    return { ok:false, reason:'format', msg:'请填写数值（可以带单位，例如 0.5A）' };
  }
  var target = Number(q.answerNum);
  var tol = Math.max(1e-9, Math.abs(target) * 1e-6);
  var numOk = Math.abs(parsed.value - target) <= tol;

  var unitOk = true;
  var msg = '';
  if(q.unit){
    if(!parsed.unit){
      // 用户没写单位
      if(q.unitRequired){
        unitOk = false;
        msg = '单位不能省略，答案要带上单位（如 '+q.answerNum+q.unit+'）';
      }
    }else{
      if(!unitsEqual(parsed.unit, q.unit)){
        unitOk = false;
        msg = '单位写错了，正确单位应该是 '+q.unit;
      }
    }
  }
  return { ok: numOk && unitOk, numOk: numOk, unitOk: unitOk, msg: msg, parsed: parsed };
}

/* 多选标准化比较 */
function sameKeySet(arrA, arrB){
  if(!Array.isArray(arrA) || !Array.isArray(arrB)) return false;
  if(arrA.length !== arrB.length) return false;
  var a = arrA.slice().sort().join(','), b = arrB.slice().sort().join(',');
  return a === b;
}

  var key = (tab === 'week') ? 'weekScore' : 'score';
  list.sort(function(a,b){

    d = accuracyOf(b) - accuracyOf(a);
    if(d) return d;
    d = (b.maxCombo||0) - (a.maxCombo||0);
    if(d) return d;
    return (a.timeMs||0) - (b.timeMs||0);
  });
  return list;
}

  var modeName = ({level:'闯关模式', timed:'限时挑战', wrong:'错题重练', fault:'故障排查'})[quiz.mode] || '答题';
  var lvName = quiz.mode === 'level' && ui.curLevelLv ? ui.curLevelLv.name : modeName;

  var html = ''+
  '<div class="card">'+
    '<div class="bar">'+
      '<span>📖 '+esc(modeName)+' · '+esc(lvName)+'</span>'+
      (quiz.mode === 'timed'
        ? '<span>⏱️ 剩余 <b id="timerDisplay" style="color:#fde047">'+Math.max(0,quiz.timeLeft)+'</b> 秒</span>'
        : '<span>第 '+(quiz.idx+1)+' / '+total+' 题</span>')+
      '<span>🔥 连击 <b style="color:#fde047">'+quiz.combo+'</b>　⭐ 本局 <b style="color:#86efac">'+quiz.score+'</b></span>'+
    '</div>'+
    '<div class="progress"><i style="width:'+pct+'%"></i></div>'+

    '<div class="qhead">'+
      '<span class="tag type">'+typeLabel(q.type)+'</span>'+
      '<span class="tag '+diffClass(q.difficulty)+'">'+q.difficulty+' · '+q.score+'分</span>'+
      '<span class="tag k">'+esc(q.knowledge)+'</span>'+
    '</div>'+

    '<div class="qstem">'+esc(q.stem).replace(/\n/g,'<br>')+'</div>'+
    renderFigure(q)+
    renderAnswerArea(q)+
    renderResultBox(q)+

    '<div style="height:14px"></div>'+
    '<div class="btn-row">'+
      (quiz.submitted
        ? '<button type="button" class="btn primary" data-action="nextQ">'+(quiz.idx+1>=quiz.qs.length?'查看结算 →':'下一题 →')+'</button>'
        : '<button type="button" class="btn primary" data-action="submitQ"'+(quiz.submitting?' disabled':'')+'>'+(quiz.submitting?'提交中…':'✅ 提交答案')+'</button>')+
      (!quiz.submitted && !quiz.usedHint
        ? '<button type="button" class="btn purple sm" data-action="useHint">💡 使用提示（本题积分减半）</button>'
        : '')+
      '<button type="button" class="btn ghost sm" data-action="goFeedback">📣 答案有误</button>'+
      '<button type="button" class="btn ghost sm" data-action="quitQuiz">✖ 退出</button>'+
    '</div>'+
  '</div>';
  return html;
}

function renderFigure(q){
  if(!q.figure) return '';
  var inner = '';
  if(q.figure === 'AMMETER')      inner = ammeterSVG();
  else if(q.figure === 'UIGRAPH') inner = uiGraphSVG();
  else if(q.figure === 'CIRCUIT') inner = circuitSVG();
  if(!inner) return '';
  return '<div class="figure-box">'+inner+'</div>';
}

function renderAnswerArea(q){
  var disabled = !!quiz.submitted;
  var h = '';

  /* ---- 单选 / 多选 ---- */
  if(q.kind === 'choice' || q.kind === 'multi'){
    var opts = q.options || [];
    h += '<div style="margin-top:14px" id="optWrap">';
    opts.forEach(function(o){
      var cls = 'option';
      if(!disabled){
        if(q.kind === 'choice'){
          if(quiz.selected === o.k) cls += ' sel';
        }else{
          if(quiz.multiSelected.indexOf(o.k) >= 0) cls += ' sel';
        }
      }else{
        var isAns = (q.kind === 'choice')
          ? (q.answer === o.k)
          : (q.answer.indexOf(o.k) >= 0);
        var isPicked = (q.kind === 'choice')
          ? (quiz.selected === o.k)
          : (quiz.multiSelected.indexOf(o.k) >= 0);
        if(isAns) cls += ' ok';
        else if(isPicked) cls += ' bad';
        cls += ' dis';
      }
      h += '<div class="'+cls+'" data-action="pickOpt" data-v="'+esc(o.k)+'">'+
             '<span class="k">'+esc(o.k)+'</span><span>'+esc(o.t)+'</span>'+
           '</div>';
    });
    h += '</div>';
    if(!disabled && q.kind === 'multi'){
      h += '<div class="tiny">多选题，请选出所有正确选项后再提交（选项可多选）。</div>';
    }
    return h;
  }

  /* ---- 判断 ---- */
  if(q.kind === 'judge'){
    var mk = function(key, label){
      var cls = 'option';
      if(!disabled){
        if(quiz.selected === key) cls += ' sel';
      }else{
        var isCorrect = (key === 'T') === q.answer;
        var isPicked = (quiz.selected === key);
        if(isCorrect) cls += ' ok';
        else if(isPicked) cls += ' bad';
        cls += ' dis';
      }
      return '<div class="'+cls+'" data-action="pickOpt" data-v="'+key+'" style="flex:1;justify-content:center">'+
               '<span class="k">'+(key==='T'?'√':'×')+'</span><span>'+label+'</span></div>';
    };
    h += '<div style="margin-top:14px;display:flex;gap:10px">'+ mk('T','正确') + mk('F','错误') +'</div>';
    return h;
  }

  /* ---- 计算题：数值 + 单位下拉 ---- */
  if(q.type === 'calc'){
    var uOpts = q.unitOptions || ['V','A','Ω','W','J'];
    var curUnit = quiz.calcUnit || uOpts[0];
    h += '<div style="margin-top:14px">'+
      '<label class="lb">填写数值并选择单位</label>'+
      '<div class="fill-row">'+
        '<input class="input" id="calcInput" type="text" inputmode="decimal" placeholder="输入数值，例如 6" value="'+esc(quiz.calcValue||'')+'"'+(disabled?' disabled':'')+'>'+
        '<select class="input" id="calcUnit" style="flex:0 0 110px"'+(!disabled?'':' disabled')+'>'+
          uOpts.map(function(u){ return '<option value="'+esc(u)+'"'+(u===curUnit?' selected':'')+'>'+esc(u)+'</option>'; }).join('')+
        '</select>'+
      '</div>'+
      '<div class="tiny" style="margin-top:6px">只需填数值，单位在右侧下拉框中选择。</div>'+
    '</div>';
    return h;
  }

  /* ---- 填空 / 读数 ---- */
  var placeholder = '输入答案';
  if(q.type === 'reading') placeholder = '例如 0.24A（数值+单位）';
  h += '<div style="margin-top:14px">'+
    '<label class="lb">'+(q.type==='reading'?'读出示数（数值+单位）':'填写答案')+'</label>'+
    '<div class="fill-row">'+
      '<input class="input" id="textInput" type="text" placeholder="'+placeholder+'" value="'+esc(quiz.textAnswer||'')+'"'+(disabled?' disabled':'')+' autocomplete="off">'+
      (q.unit ? '<span class="unit-inline">单位参考：'+esc(q.unit)+'</span>' : '')+
    '</div>'+
    '<div class="tiny" style="margin-top:6px">系统会自动忽略空格、换行和常见标点；数值 0.5 与 0.50 视为相同，但单位写错会判错。</div>'+
  '</div>';
  return h;
}

function renderResultBox(q){
  if(!quiz.submitted || !quiz.lastJudge) return '';
  var j = quiz.lastJudge;
  var stdAns = stdAnswerText(q);
  var h = '<div class="result-box '+(j.ok?'ok':'bad')+'">';
  h += '<div class="rb-head"><span class="ico">'+(j.ok?'✓':'✕')+'</span>'+
       '<span>'+(j.ok?'答对啦！':'答错了')+'</span>'+
       '<span class="tiny" style="margin-left:auto">'+(j.ok?('本题 +'+quiz.lastGain+' 分'):'答错不扣分，已加入错题本')+'</span></div>';

  h += '<div class="ans-line">✅ 标准答案：<b>'+esc(stdAns)+'</b>';
  if(!j.ok && j.userText){
    h += '　<span class="tiny">你的作答：'+esc(j.userText)+'</span>';
  }
  h += '</div>';

  if(!j.ok && j.tip){
    h += '<div class="ans-line" style="border-color:rgba(239,68,68,.4)">⚠️ '+esc(j.tip)+'</div>';
  }

  h += '<div class="sec"><div class="sh">📘 解析</div><div class="sb">'+esc(q.explain).replace(/\n/g,'<br>')+'</div></div>';
  if(q.formula){
    h += '<div class="sec formula"><div class="sh">🧮 公式</div><div class="sb">'+esc(q.formula)+'</div></div>';
  }
  if(q.pitfall){
    h += '<div class="sec pit"><div class="sh">⚠️ 易错点</div><div class="sb">'+esc(q.pitfall)+'</div></div>';
  }
  h += '</div>';
  return h;
}

function stdAnswerText(q){
  if(q.kind === 'choice'){
    var o = (q.options||[]).filter(function(x){ return x.k === q.answer; })[0];
    return q.answer + (o ? '. ' + o.t : '');
  }
  if(q.kind === 'multi'){
    return q.answer.slice().sort().join('、');
  }
  if(q.kind === 'judge'){
    return q.answer ? '正确' : '错误';
  }
  if(q.answerNum !== undefined){
    var val = q.answerNum;
    var s = (Math.round(val*1e6)/1e6).toString();
    return s + (q.unit || '');
  }
  return String(q.answer);
}

/* ---------- 15. 答题流程 ---------- */
function buildQuizQuestions(ids){
  return ids.map(function(id){ return getQ(id); }).filter(Boolean);
}
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function startQuiz(mode, opts){
  opts = opts || {};
  var qs = [];
  var title = '';

  if(mode === 'level'){
    var lv = LEVELS.filter(function(x){ return x.id === opts.levelId; })[0];
    if(!lv) { toast('关卡不存在'); return; }
    ui.curLevel = lv.id;
    ui.curLevelLv = lv;
    qs = buildQuizQuestions(getLevelQuestions(lv.id).map(function(q){ return q.id; }));
    title = '第'+lv.num+'关 · '+lv.name;
  } else if(mode === 'timed'){
    qs = buildQuizQuestions(shuffle(QUESTIONS.map(function(q){ return q.id; })).slice(0, 30));
    title = '限时挑战 60 秒';
  } else if(mode === 'wrong'){
    var ids = Object.keys(state.wrongBook || {});
    if(!ids.length){ toast('错题本是空的，先去闯关吧！'); return; }
    qs = buildQuizQuestions(shuffle(ids));
    title = '错题重练';
  } else if(mode === 'fault'){
    var fids = QUESTIONS.filter(function(q){ return q.type === 'fault'; }).map(function(q){ return q.id; });
    qs = buildQuizQuestions(shuffle(fids));
    title = '故障排查';
  }

  if(!qs.length){ toast('没有可用题目'); return; }

  quiz = {
    mode: mode,
    title: title,
    levelId: opts.levelId || null,
    qs: qs,
    idx: 0,
    combo: 0,
    maxCombo: 0,
    score: 0,
    correct: 0,
    answered: 0,
    perfect: true,
    totalTimeMs: 0,
    qStartTime: Date.now(),
    selected: null,
    multiSelected: [],
    textAnswer: '',
    calcValue: '',
    calcUnit: '',
    submitted: false,
    submitting: false,
    usedHint: false,
    lastJudge: null,
    lastGain: 0,
    timeLeft: 60,
    timerId: null,
    finished: false
  };
  quizToken++;
  ui.screen = 'quiz';
  sfxClick();
  render();

  if(mode === 'timed'){
    startTimer();
  }
}

function startTimer(){
  if(!quiz || quiz.timerId) return;
  quiz.timerId = setInterval(function(){
    if(!quiz || quiz.finished){
      clearInterval(quiz.timerId);
      return;
    }
    quiz.timeLeft--;
    var t = $('#timerDisplay');
    if(t) t.textContent = Math.max(0, quiz.timeLeft);
    if(quiz.timeLeft <= 0){
      clearInterval(quiz.timerId);
      quiz.timerId = null;
      toast('时间到！');
      finishQuiz();
    }
  }, 1000);
}
function stopTimer(){
  if(quiz && quiz.timerId){
    clearInterval(quiz.timerId);
    quiz.timerId = null;
  }
}

function resetQuestionInputs(){
  quiz.selected = null;
  quiz.multiSelected = [];
  quiz.textAnswer = '';
  quiz.calcValue = '';
  quiz.calcUnit = '';
  quiz.submitted = false;
  quiz.submitting = false;
  quiz.usedHint = false;
  quiz.lastJudge = null;
  quiz.lastGain = 0;
  quiz.qStartTime = Date.now();
}

function pickOption(key){
  if(!quiz || quiz.submitted) return;
  var q = quiz.qs[quiz.idx];
  if(!q) return;
  if(q.kind === 'choice'){
    quiz.selected = key;
    sfxClick();
  } else if(q.kind === 'judge'){
    quiz.selected = key;
    sfxClick();
  } else if(q.kind === 'multi'){
    var i = quiz.multiSelected.indexOf(key);
    if(i >= 0) quiz.multiSelected.splice(i,1);
    else quiz.multiSelected.push(key);
    sfxClick();
  }
  var sc = window.pageYOffset || document.documentElement.scrollTop;
  renderView();
  window.scrollTo(0, sc);
}

function submitAnswer(){
  if(!quiz || quiz.submitted || quiz.submitting) return;
  var q = quiz.qs[quiz.idx];
  if(!q) return;

  /* --- 取值与校验 --- */
  var userText = '';
  var userValue = null;

  if(q.kind === 'choice'){
    if(!quiz.selected){ toast('请先选择一个选项'); return; }
    userValue = quiz.selected;
    userText = quiz.selected;
  } else if(q.kind === 'multi'){
    if(!quiz.multiSelected.length){ toast('请至少选择一个选项'); return; }
    userValue = quiz.multiSelected.slice().sort();
    userText = userValue.join('、');
  } else if(q.kind === 'judge'){
    if(!quiz.selected){ toast('请选择"正确"或"错误"'); return; }
    userValue = quiz.selected === 'T';
    userText = quiz.selected === 'T' ? '正确' : '错误';
  } else if(q.type === 'calc'){
    var cv = (quiz.calcValue||'').trim();
    if(!cv){ toast('请先填写数值'); return; }
    var cu = quiz.calcUnit || ((q.unitOptions||['V'])[0]);
    userText = cv + cu;
    userValue = cv + cu;
  } else {
    var tv = (quiz.textAnswer||'').trim();
    if(!tv){ toast('请先填写答案'); return; }
    userText = tv;
    userValue = tv;
  }

  /* --- 提交中状态（防重复提交） --- */
  quiz.submitting = true;
  renderView();

  var token = quizToken;
  setTimeout(function(){
    if(!quiz || token !== quizToken) return;
    quiz.submitting = false;
    doJudge(q, userValue, userText);
  }, 180);
}

function doJudge(q, userValue, userText){
  var ok = false;
  var tip = '';

  if(q.kind === 'choice'){
    ok = (userValue === q.answer);
  } else if(q.kind === 'multi'){
    ok = sameKeySet(userValue, q.answer);
    if(!ok){
      var miss = q.answer.filter(function(k){ return userValue.indexOf(k) < 0; });
      var extra = userValue.filter(function(k){ return q.answer.indexOf(k) < 0; });
      var parts = [];
      if(miss.length) parts.push('漏选：'+miss.join('、'));
      if(extra.length) parts.push('多选/错选：'+extra.join('、'));
      tip = parts.join('；');
    }
  } else if(q.kind === 'judge'){
    ok = (userValue === q.answer);
  } else if(q.type === 'calc'){
    // 数值与单位分开判断
    var parsed = parseNumericInput(userValue);
    var target = Number(q.answerNum);
    var tol = Math.max(1e-9, Math.abs(target)*1e-6);
    var numOk = parsed && Math.abs(parsed.value - target) <= tol;
    var unitOk = parsed && unitsEqual(parsed.unit, q.unit);
    ok = !!(numOk && unitOk);
    if(!ok){
      if(!numOk && !unitOk) tip = '数值和单位都不正确。正确单位应为 '+q.unit;
      else if(!numOk) tip = '单位选对了，但数值不对。';
      else tip = '数值对啦，但单位选错了，正确单位是 '+q.unit+'。';
    }
  } else {
    var res = judgeNumeric(q, userText);
    ok = res.ok;
    if(!ok) tip = res.msg || '答案不正确，请对照标准答案检查。';
  }

  /* --- 计分 --- */
  var elapsedMs = Date.now() - quiz.qStartTime;
  var elapsedSec = elapsedMs / 1000;
  var gain = 0;
  var firstTime = !state.firstCorrect[q.id];

  if(ok){
    quiz.correct++;
    quiz.combo++;
    if(quiz.combo > quiz.maxCombo) quiz.maxCombo = quiz.combo;

    var base = q.score;
    var speedBonus = 0;
    if(elapsedSec <= 5) speedBonus = 5;
    else if(elapsedSec <= 10) speedBonus = 3;

    var comboBonus = 0;
    if(quiz.combo === 3) comboBonus = 5;
    else if(quiz.combo === 5) comboBonus = 10;
    else if(quiz.combo >= 8) comboBonus = 20;

    gain = base + speedBonus + comboBonus;
    if(!firstTime) gain = Math.max(1, Math.round(gain * 0.5));  // 重复作答得分减半
    if(quiz.usedHint) gain = Math.round(gain / 2);              // 使用提示后积分减半
    quiz.score += gain;

    sfxCorrect();
  } else {
    quiz.combo = 0;
    quiz.perfect = false;
    gain = 0;
    sfxWrong();
    // 加入错题本
    if(!state.wrongBook[q.id]) state.wrongBook[q.id] = { wrongCount:0, lastTime:0 };
    state.wrongBook[q.id].wrongCount++;
    state.wrongBook[q.id].lastTime = Date.now();
  }

  quiz.answered++;

  /* --- 全局统计 --- */
  state.answered++;
  state.totalTimeMs += elapsedMs;
  if(ok){ state.correct++; state.totalScore += gain; }
  state.firstCorrect[q.id] = state.firstCorrect[q.id] || ok;

  if(!state.qLog[q.id]) state.qLog[q.id] = { correct:0, wrong:0 };
  if(ok) state.qLog[q.id].correct++; else state.qLog[q.id].wrong++;

  // 按题型
  if(!state.typeStats[q.type]) state.typeStats[q.type] = { correct:0, total:0 };
  state.typeStats[q.type].total++;
  if(ok) state.typeStats[q.type].correct++;

  // 按知识点
  if(!state.knowledgeStats[q.knowledge]) state.knowledgeStats[q.knowledge] = { correct:0, total:0 };
  state.knowledgeStats[q.knowledge].total++;
  if(ok) state.knowledgeStats[q.knowledge].correct++;

  // 故障连续答对 streak
  if(q.type === 'fault'){
    state._faultStreak = ok ? ((state._faultStreak||0) + 1) : 0;
  }

  // 最高连击（全局）
  if(quiz.maxCombo > state.maxCombo) state.maxCombo = quiz.maxCombo;

  // 错题重练答对 → 移出错题本
  if(quiz.mode === 'wrong' && ok && state.wrongBook[q.id]){
    delete state.wrongBook[q.id];
    tip = tip || '太棒了，这道题已从错题本移出！';
  }
  // 提升到全局错题本的题目再次答对 2 次也移出
  if(ok && state.wrongBook[q.id] && state.qLog[q.id].correct >= 2 && quiz.mode !== 'wrong'){
    delete state.wrongBook[q.id];
  }

  state.totalScore = Math.max(0, state.totalScore);
  quiz.lastJudge = { ok: ok, tip: tip, userText: userTextTextSafe(userText) };
  quiz.lastGain = gain;
  quiz.submitted = true;

  saveState();
  checkBadges();
  renderView();
  var sc = window.pageYOffset || document.documentElement.scrollTop;
  window.scrollTo(0, sc);
}
function userTextTextSafe(t){
  t = String(t === null || t === undefined ? '' : t);
  return t.length > 60 ? t.slice(0,60) + '…' : t;
}

function nextQuestion(){
  if(!quiz || !quiz.submitted) return;
  if(quiz.idx + 1 >= quiz.qs.length){
    finishQuiz();
    return;
  }
  quiz.idx++;
  resetQuestionInputs();
  renderView();
  window.scrollTo(0, 0);
}

function finishQuiz(){
  if(!quiz || quiz.finished) return;
  quiz.finished = true;
  stopTimer();

  var completeBonus = 0;
  var perfectBonus = 0;
  var full = quiz.qs.reduce(function(s,q){ return s + q.score; }, 0);

  if(quiz.mode === 'level' && quiz.levelId){
    var lb = state.levelBest[quiz.levelId] || { score:0, full:full, completed:false };
    var firstComplete = !lb.completed;

    if(firstComplete){
      completeBonus = 20;
      state.totalScore += completeBonus;
      lb.completed = true;
    }
    // 更新最佳成绩
    lb.full = full;
    lb.bestThisRun = quiz.score;
    lb.score = Math.max(lb.score || 0, quiz.score);
    state.levelBest[quiz.levelId] = lb;

    // 单关满分
    if(quiz.correct === quiz.qs.length && quiz.qs.length > 0 && !lb.gotPerfect){
      perfectBonus = 30;
      state.totalScore += perfectBonus;
      lb.gotPerfect = true;
      state.levelBest[quiz.levelId] = lb;
    }
  }

  state.totalScore += quiz.score;
  saveState();

  quiz.completeBonus = completeBonus;
  quiz.perfectBonus = perfectBonus;
  quiz.full = full;

  checkBadges();
  ui.screen = 'result';
  renderView();
  window.scrollTo(0, 0);
}

function quitQuiz(){
  stopTimer();
  quizToken++;
  quiz = null;
  ui.screen = 'home';
  render();
}

/* ---------- 16. 结算页 ---------- */
function viewResult(){
  if(!quiz) return '<div class="card">没有结算数据。<button type="button" class="btn" data-action="go" data-v="home">返回首页</button></div>';
  var total = quiz.qs.length;
  var acc = total ? Math.round(quiz.correct/total*100) : 0;
  var isFull = quiz.correct === total && total > 0;
  var rankText = isFull ? '🏆 完美通关！' : (acc >= 80 ? '🎉 表现优秀！' : (acc >= 60 ? '👍 继续加油！' : '💪 多练几遍就熟了！'));

  var h = '<div class="card" style="text-align:center">'+
    '<div style="font-size:52px;line-height:1.1">'+(isFull?'🏆':'🎯')+'</div>'+
    '<h2 style="margin-top:8px;font-size:20px">'+esc(rankText)+'</h2>'+
    '<div class="muted">'+esc(quiz.title || '答题')+'</div>'+
  '</div>';

  h += '<div class="card">'+
    '<div class="card-title"><span class="dot"></span>本局战绩</div>'+
    '<table class="tbl">'+
      '<tr><td>答对 / 总题数</td><td class="hl">'+quiz.correct+' / '+total+'</td></tr>'+
      '<tr><td>正确率</td><td class="hl">'+acc+'%</td></tr>'+

      (quiz.perfectBonus  ? '<tr><td>单关满分奖励</td><td class="hl">+'+quiz.perfectBonus+' 分</td></tr>' : '')+
      '<tr><td>本局总得分</td><td class="hl">'+(quiz.score + (quiz.completeBonus||0) + (quiz.perfectBonus||0))+' 分</td></tr>'+

    '</table>'+

  var wrongList = quiz.qs.filter(function(q){

  });
  if(wrongList.length){
    h += '<div class="card"><div class="card-title"><span class="dot"></span>本局需要巩固的题目</div>';
    wrongList.slice(0,6).forEach(function(q){
      h += '<div class="wrong-item"><div class="wi-t">'+esc(String(q.stem).split('\n')[0])+'</div>'+

           '<span class="tiny">标准答案：'+esc(stdAnswerText(q))+'</span></div></div>';
    });

  }

  h += '<div class="card"><div class="btn-row">'+
    '<button type="button" class="btn primary" data-action="go" data-v="home">🏠 返回首页</button>'+
    (quiz.mode === 'level' && quiz.levelId
      ? '<button type="button" class="btn purple" data-action="startLevel" data-v="'+quiz.levelId+'">🔁 再挑战一次</button>'

    '<button type="button" class="btn ghost" data-action="go" data-v="wrong">📕 错题本</button>'+

  return h;
}

          '<div style="margin-top:4px;color:#cbd5e1">'+esc(f.text)+'</div>'+
          (f.nick ? '<div class="tiny">反馈人：'+esc(f.nick)+'</div>' : '')+
        '</div>';
      });
      h += '<button type="button" class="btn sm pink" data-action="clearFeedback">🗑️ 清空反馈</button>';
    }
    h += '</div>';
  }

  h += '<button type="button" class="btn ghost full" data-action="go" data-v="home">← 返回首页</button>';
  return h;
}

function doSaveAnswer(qid){
  var q = getQ(qid);
  if(!q) return;
  var v = ($('#eaInput') ? $('#eaInput').value.trim() : '');
  if(!v){ toast('请填写答案'); return; }
  var edit = state.bankEdits[qid] || {};

  if(q.kind === 'choice'){
    var key = v.toUpperCase().replace(/[^A-Z]/g,'');
    if(!key){ toast('选择题答案应为 A/B/C/D'); return; }
    edit.answer = key.charAt(0);
  } else if(q.kind === 'multi'){
    var keys = v.toUpperCase().replace(/[^A-Z]/g,'').split('').sort();
    var uniq = [];
    keys.forEach(function(k){ if(uniq.indexOf(k)<0) uniq.push(k); });
    if(!uniq.length){ toast('多选题答案应包含选项字母'); return; }
    edit.answer = uniq;
  } else if(q.kind === 'judge'){
    edit.answer = (v.indexOf('正确') >= 0 || v === '√' || v.toUpperCase() === 'T');
  } else {
    var num = parseFloat(v.replace(/[^\d.\-+eE]/g,''));
    if(!isFinite(num)){ toast('数值题答案应为数字'); return; }
    edit.answerNum = num;
    var uEl = $('#eaUnit');
    if(uEl && uEl.value.trim()) edit.unit = uEl.value.trim();
  }

  state.bankEdits[qid] = edit;
  saveState();
  closeModal();
  toast('标准答案已更新');
  renderView();
}

function doImport(kind){
  var txt = '';
  var ta = $('#impText');
  if(ta && ta.value.trim()) txt = ta.value.trim();
  var fileEl = $('#impFile');

  function apply(text){
    var data;
    try{ data = JSON.parse(text); }
    catch(e){ toast('JSON 格式错误，请检查'); return; }

    if(kind === 'bank'){
      if(!Array.isArray(data)){ toast('题库应为 JSON 数组'); return; }
      var addCount = 0, updateCount = 0;
      data.forEach(function(item){
        if(!item || !item.id) return;
        var idx = -1, i;
        for(i=0;i<QUESTIONS.length;i++){ if(QUESTIONS[i].id === item.id){ idx = i; break; } }
        if(idx >= 0){
          QUESTIONS[idx] = Object.assign({}, QUESTIONS[idx], item);
          updateCount++;
        }else{
          if(!item.level) item.level = 'l1';
          if(!item.type) item.type = 'single';
          if(!item.kind) item.kind = 'choice';
          if(!item.score) item.score = 5;
          if(!item.difficulty) item.difficulty = '简单';
          if(!item.knowledge) item.knowledge = '未分类';
          if(!item.explain) item.explain = '（导入题目，暂无解析）';
          if(!item.formula) item.formula = '';
          if(!item.pitfall) item.pitfall = '';
          QUESTIONS.push(item);
          addCount++;
        }
      });
      saveState();
      toast('题库导入完成：新增 '+addCount+' 题，更新 '+updateCount+' 题');
      closeModal();
      renderView();
    }else{
      if(!data || typeof data !== 'object'){ toast('存档格式错误'); return; }
      if(data.profile || data.totalScore !== undefined || data.badges){
        state = Object.assign(defaultState(), data);
        state.profile  = Object.assign(defaultState().profile,  data.profile || {});
        state.settings = Object.assign({sound:true}, data.settings || {});
        saveState();
        toast('存档导入成功');
        closeModal();
        ui.screen = 'home';
        render();
      }else if(Array.isArray(data)){
        // 当作成绩列表导入
        state.imported = (state.imported || []).concat(data);
        saveState();
        toast('已导入 '+data.length+' 条成绩记录');
        closeModal();
        renderView();
      }else{
        toast('无法识别的存档格式');
      }
    }
  }

  if(fileEl && fileEl.files && fileEl.files[0]){
    var reader = new FileReader();
    reader.onload = function(){ apply(String(reader.result)); };
    reader.onerror = function(){ toast('文件读取失败'); };
    reader.readAsText(fileEl.files[0], 'utf-8');
  }else if(txt){
    apply(txt);
  }else{
    toast('请粘贴 JSON 或选择文件');
  }
}

/* ---------- 23. 导入导出 ---------- */
function download(filename, content, mime){
  try{
    var blob = new Blob([content], { type: mime || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{ document.body.removeChild(a); }catch(e){}
      URL.revokeObjectURL(url);
    }, 300);
    toast('已开始下载：' + filename);
  }catch(e){
    console.warn(e);
    toast('下载失败，请尝试复制数据手动保存');
  }
}

  };
  var name = '电路侦探社_成绩_' + dateKey(new Date()) + '.json';

function exportCSV(){
  var list = getLeaderboard(ui.leaderboardTab || 'total');
  var rows = [['排名','昵称','班级','年级','总积分','本周积分','正确率(%)','最高连击','答题用时(秒)','徽章数']];
  list.forEach(function(p, i){
    rows.push([
      i+1,
      p.nickname || '',
      p.className || '',
      p.grade || '',
      p.score || 0,
      p.weekScore || 0,
      Math.round(accuracyOf(p)*100),
      p.maxCombo || 0,
      Math.round((p.timeMs||0)/1000),
      p.isMe ? Object.keys(state.badges||{}).length : (p.badges||0)
    ]);
  });
  var csv = '\ufeff' + rows.map(function(r){
    return r.map(function(c){
      var s = String(c === null || c === undefined ? '' : c);
      if(s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0){
        return '"' + s.replace(/"/g,'""') + '"';
      }
      return s;
    }).join(',');
  }).join('\r\n');
  download('电路侦探社_成绩_' + dateKey(new Date()) + '.csv', csv, 'text/csv;charset=utf-8');
}

/* ---------- 24. 事件委托（保证动态生成的元素也可点击） ---------- */
document.addEventListener('click', function(ev){
  var t = ev.target;
  if(!t || !t.closest) return;

  /* 弹窗遮罩关闭 */
  var mask = t.closest('.modal-mask');
  if(mask && t === mask){
    closeModal();
    return;
  }

  var el = t.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  var val = el.getAttribute('data-v');
  if(!action) return;

  // 阻止表单默认行为（如未来加入 form）
  if(el.tagName === 'BUTTON'){ /* type=button 已保证不提交 */ }

  switch(action){
    case 'go':
      sfxClick();
      stopTimer();
      if(ui.screen === 'quiz' && val !== 'quiz'){ quizToken++; quiz = null; }
      ui.screen = val || 'home';
      render();
      window.scrollTo(0,0);
      break;

    case 'pickAvatar':
      state.profile.avatar = val;
      saveState();
      renderView();
      break;

    case 'saveProfile':
      var ni = $('#nickInput');
      var cs = $('#classSel');
      var gs = $('#gradeSel');
      if(ni) state.profile.nickname = (ni.value || '').trim().slice(0,12);
      if(!state.profile.nickname){ toast('请先给自己起个昵称'); return; }
      if(cs) state.profile.className = cs.value;
      if(gs) state.profile.grade = gs.value;
      saveState();
      toast('档案已保存，侦探 ' + state.profile.nickname + '，出发！');
      ui.screen = 'levels';
      render();
      window.scrollTo(0,0);
      break;

    case 'openLevel':
      ui.curLevel = val;
      ui.curLevelLv = LEVELS.filter(function(x){return x.id===val;})[0];
      ui.screen = 'levelDetail';
      render();
      window.scrollTo(0,0);
      break;

    case 'startLevel':
      startQuiz('level', { levelId: val });
      break;

    case 'startTimed':
      startQuiz('timed');
      break;

    case 'startWrong':
      startQuiz('wrong');
      break;

    case 'startFault':
      startQuiz('fault');
      break;

    case 'pickOpt':
      pickOption(val);
      break;

    case 'submitQ':
      submitAnswer();
      break;

    case 'nextQ':
      nextQuestion();
      break;

    case 'useHint':
      if(!quiz || quiz.submitted) return;
      quiz.usedHint = true;
      var qq = quiz.qs[quiz.idx];
      var hint = '';
      if(qq.kind === 'choice' || qq.kind === 'multi'){
        hint = '提示：正确答案涉及的关键词 —— ' + (qq.formula || qq.knowledge);
      }else if(qq.kind === 'judge'){
        hint = '提示：判断依据 —— ' + (qq.formula || qq.knowledge);
      }else{
        hint = '提示：本题适用公式 —— ' + (qq.formula || '见解析');
      }
      toast(hint);
      renderView();
      break;

    case 'quitQuiz':
      openModal('<h3>退出答题？</h3><div class="muted">本局进度不会保存，确定退出吗？</div><div style="height:14px"></div>'+
        '<div class="btn-row"><button type="button" class="btn pink" data-action="doQuit">确认退出</button>'+
        '<button type="button" class="btn ghost" data-action="closeModal">继续答题</button></div>');
      break;

    case 'doQuit':
      closeModal();
      quitQuiz();
      break;

    case 'goFeedback':
      openFeedbackModal();
      break;

    case 'submitFeedback':
      submitFeedback();
      break;

    case 'closeModal':
      closeModal();
      break;

    case 'closeModalMask':
      closeModal();
      break;

    case 'lbTab':
      ui.leaderboardTab = val;
      renderView();
      break;

    case 'tTab':
      ui.teacherTab = val;
      renderView();
      break;

    case 'toggleSound':
      state.settings.sound = !state.settings.sound;
      saveState();
      if(state.settings.sound) sfxClick();
      renderView();
      toast(state.settings.sound ? '音效已开启' : '音效已关闭');
      break;

    case 'viewAnswer':
      var box = document.getElementById('ans_' + val);
      if(box) box.style.display = (box.style.display === 'none' || !box.style.display) ? 'block' : 'none';
      break;

    case 'exportData':
      exportData();
      break;

    case 'exportCSV':
      exportCSV();
      break;

    case 'importData':
      openImportModal('save');
      break;

    case 'importBank':
      openImportModal('bank');
      break;

    case 'exportBank':
      exportBank();
      break;

    case 'doImport':
      doImport(val);
      break;

    case 'resetRank':
      resetRank();
      break;

    case 'doResetRank':
      doResetRank();
      break;

    case 'resetAll':
      resetAll();
      break;

    case 'doResetAll':
      doResetAll();
      break;

    case 'resetBank':
      resetBank();
      break;

    case 'editAnswer':
      openEditAnswerModal(val);
      break;

    case 'doSaveAnswer':
      doSaveAnswer(val);
      break;

    case 'editScore':
      openEditScoreModal(val);
      break;

    case 'doSaveScore':
      doSaveScore(val);
      break;

    case 'resetQ':
      delete state.bankEdits[val];
      saveState();
      toast('已还原该题');
      renderView();
      break;

    case 'saveAnswerEdit':
      (function(){
        var sel = $('#editQSel');
        if(!sel) return;
        openEditAnswerModal(sel.value);
      })();
      break;

    case 'saveCfg':
      (function(){
        var a = parseInt(($('#cfgEasy')||{}).value, 10);
        var b = parseInt(($('#cfgMid')||{}).value, 10);
        var c = parseInt(($('#cfgHard')||{}).value, 10);
        if(!isFinite(a) || !isFinite(b) || !isFinite(c)){ toast('请填写有效数字'); return; }
        state.cfgEasy = clamp(a,1,50);
        state.cfgMid  = clamp(b,1,50);
        state.cfgHard = clamp(c,1,50);
        // 应用分值（仅影响之后的新局）
        QUESTIONS.forEach(function(q){
          q.score = (q.difficulty === '简单') ? state.cfgEasy :
                    (q.difficulty === '中等') ? state.cfgMid : state.cfgHard;
        });
        saveState();
        toast('分值设置已保存');
        renderView();
      })();
      break;

    case 'clearFeedback':
      state.feedback = [];
      saveState();
      toast('反馈已清空');
      renderView();
      break;
  }
}, false);

document.addEventListener('keydown', function(ev){
  if(ev.key !== 'Enter') return;
  var t = ev.target;
  if(!t) return;
  if(t.tagName === 'TEXTAREA') return;
  if(t.id === 'textInput' || t.id === 'calcInput'){
    ev.preventDefault();
    submitAnswer();
  }else if(t.id === 'nickInput'){
    ev.preventDefault();
    var btn = document.querySelector('[data-action="saveProfile"]');
    if(btn) btn.click();
  }
}, false);

/* ---------- 26. 启动 ---------- */
function boot(){
  loadState();

  // 首次访问：给出默认昵称
  if(!state.profile.nickname) state.profile.nickname = '';

  var gotDaily = checkDailyLogin();
  if(gotDaily){ saveState(); }

  render();

  if(gotDaily){
    setTimeout(function(){ toast('每日首次登录 +5 分，连续登录第 ' + state.streakDays + ' 天'); }, 700);
  }
  setTimeout(function(){ checkBadges(); }, 1400);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot, false);
}else{
  boot();
}

/* 全局兜底：避免未捕获异常造成白屏（同时打印到控制台便于排查） */
window.addEventListener('error', function(e){
  console.warn('[电路侦探社] 运行提示：', e && e.message ? e.message : e);
}, false);
</script>
</body>
</html>
